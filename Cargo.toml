[package]
name = "pastorust"
version = "0.1.0"
edition = "2024"

default-run = "pastorust-web"

[features]
firmware = []

[[bin]]
name = "pastorust"
path = "main.rs"
required-features = ["firmware"]

[[bin]]
name = "pastorust-web"
path = "src/bin/web_app.rs"

[[bin]]
name = "usb-hello"
path = "usb_hello.rs"
required-features = ["firmware"]

[[bin]]
name = "wifi-led-test"
path = "wifi_led_test.rs"
required-features = ["firmware"]

[[bin]]
name = "gpio0-led-test"
path = "gpio0_led_test.rs"
required-features = ["firmware"]

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
cyw43 = { version = "0.7.0", features = ["defmt"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
defmt = "1.0.1"
defmt-rtt = "1.0.0"
esp-hal-dhcp-server = { version = "0.4.0", default-features = false }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = [
    "defmt",
    "tcp",
    "medium-ethernet",
    "proto-ipv4",
] }
embassy-rp = { version = "0.10.0", features = [
    "defmt",
    "time-driver",
    "critical-section-impl",
    "rp235xa",
    "executor-thread",
    "executor-interrupt",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-sync = "0.8.0"
embassy-usb = { version = "0.6.0", features = ["defmt"] }
heapless = "0.9.3"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1"

[target.'cfg(not(all(target_arch = "arm", target_os = "none")))'.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
